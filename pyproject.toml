[project]
name = "georeset-viz"
version = "0.1.0"
description = "Builds the static GeoReSeT text atlas (Rhône-Alpes, French land-use sentences)"
readme = "README.md"
authors = [{ name = "Noé Flandre", email = "noe.flandre@inria.fr" }]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "h3>=4.1",
    "huggingface-hub>=0.26",
    "numpy>=2.0",
    "onnxruntime>=1.20",
    "shapely>=2.0",
    "tokenizers>=0.20",
]

[dependency-groups]
dev = [
    "coverage>=7.6",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "radon>=6.0",
    "ruff>=0.8",
    "ty>=0.0.1a1",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C90", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 4

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs Hugging Face Hub access"]

[tool.coverage.run]
source = ["georeset_viz"]
branch = true
